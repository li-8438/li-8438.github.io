<!--
  favicon.svg —— 浏览器标签页图标

  被谁引用：每个 HTML 的 <link rel="icon" href="./assets/svg/favicon.svg" />
  设计：圆角方块底（品牌青绿）+ 白色字母 "TB"（Tech Blog）

  用 SVG 做 favicon 的好处：矢量、体积小、不用准备 16/32/64 多套 PNG。
  ⚠️ 兼容性：现代浏览器都支持，IE 和老版本 Safari 不支持，会退回默认图标。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 圆角方形底 -->
  <rect width="32" height="32" rx="8" fill="#0b9aa8"/>
  <!-- 一条 path 画出 "T" 和 "B" 两个字形，比用 <text> 更可靠（不依赖系统字体） -->
  <path d="M8 20V12h3.2c2.2 0 3.5 1.1 3.5 3s-1.3 3-3.5 3H10.2V20H8zm2.2-3.6h1c.9 0 1.4-.5 1.4-1.4s-.5-1.4-1.4-1.4h-1v2.8zM17 12h2l3.8 8h-2.2l-.6-1.4H18l-.6 1.4H15l2-8zm1.6 5h1.6L19.4 14 18.6 17z" fill="#fff"/>
</svg>
