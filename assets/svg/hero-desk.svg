<!--
  hero-desk.svg —— 首页 Hero 区的插画（一个"工作台"场景）

  被谁引用：assets/css/main.css 的 .desk（background: url("../svg/hero-desk.svg")）
  画布尺寸：viewBox="0 0 640 460"，等比 contain 显示，不会变形

  SVG 入门要点（配合下面的注释看）：
    · viewBox 定义坐标系，宽高属性只影响"默认渲染尺寸"，这里由 CSS 控制，所以可省略
    · 图形是"后画的盖在先画的上面"，所以顺序 = 图层顺序（先桌子，再显示器，再小装饰）
    · fill="none" 写在根标签上，作为所有元素的默认填充
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" fill="none">
  <defs>
    <!-- 渐变要放在 <defs> 里定义，再用 fill="url(#id)" 引用（可复用，不用重复写色标） -->
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <!-- x1/y1 → x2/y2 是渐变方向：(0,0) 到 (1,1) 表示从左上到右下 -->
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <!-- 屏幕渐变：竖直方向（x 相同，y 从 0 到 1）从上到下变深 -->
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3b4d"/>
      <stop offset="1" stop-color="#082433"/>
    </linearGradient>
  </defs>

  <!-- 地面阴影（一个压扁的椭圆，用来"托住"桌子，避免画面飘着） -->
  <ellipse cx="330" cy="400" rx="210" ry="22" fill="#d7eef2"/>
  <!-- 桌面 + 两条桌腿 -->
  <rect x="120" y="292" width="420" height="18" rx="4" fill="#cfe4ea"/>
  <rect x="138" y="310" width="16" height="78" rx="3" fill="#b7d3db"/>
  <rect x="508" y="310" width="16" height="78" rx="3" fill="#b7d3db"/>

  <!-- 左显示器：外框 + 内屏 + 屏幕上四条"代码行"（宽度递减，模拟代码长短不一） -->
  <rect x="188" y="148" width="168" height="118" rx="8" fill="#163445"/>
  <rect x="196" y="156" width="152" height="96" rx="4" fill="url(#scr)"/>
  <rect x="204" y="166" width="86" height="6" rx="2" fill="#5eead4"/>
  <rect x="204" y="180" width="118" height="4" rx="2" fill="#7dd3fc" opacity=".8"/>
  <rect x="204" y="190" width="102" height="4" rx="2" fill="#99f6e4" opacity=".55"/>
  <rect x="204" y="200" width="70" height="4" rx="2" fill="#67e8f9" opacity=".45"/>

  <!-- 右显示器（带一个头像卡片：方块 + 两行文字 + 渐变圆点头像） -->
  <rect x="372" y="132" width="150" height="134" rx="8" fill="#163445"/>
  <rect x="380" y="140" width="134" height="112" rx="4" fill="url(#scr)"/>
  <rect x="392" y="156" width="28" height="28" rx="6" fill="#22d3ee" opacity=".35"/>
  <rect x="428" y="162" width="64" height="5" rx="2" fill="#99f6e4"/>
  <rect x="428" y="174" width="50" height="4" rx="2" fill="#7dd3fc" opacity=".6"/>
  <circle cx="406" cy="170" r="8" fill="url(#g1)"/>

  <!-- 桌面上的椅子与坐着的人（头 + 身体 + 两只眼睛，简笔风格） -->
  <rect x="250" y="268" width="88" height="10" rx="3" fill="#9ab8c2"/>
  <rect x="268" y="248" width="52" height="22" rx="4" fill="#e8eef1"/>
  <circle cx="294" cy="230" r="26" fill="#1f3b4d"/>
  <path d="M262 292c8-28 20-42 32-42s24 14 32 42" fill="#163445"/>
  <circle cx="286" cy="226" r="3" fill="#fff"/>
  <circle cx="302" cy="226" r="3" fill="#fff"/>

  <!-- 桌上的便签/纸片 -->
  <rect x="168" y="236" width="46" height="34" rx="6" fill="#fff"/>
  <rect x="174" y="244" width="22" height="4" rx="2" fill="#67e8f9"/>
  <rect x="174" y="252" width="16" height="4" rx="2" fill="#cbd5e1"/>

  <!-- 两个漂浮的小图标。
       <g transform="translate(x y)"> 相当于"把坐标系原点挪到 (x,y)"，
       里面的坐标就可以从 (0,0) 开始写，移动整个组时只改 translate 一处。 -->
  <g transform="translate(92 108)">
    <!-- 代码标签 </>。注意尖括号必须写成 &lt; &gt;，否则会被当成标签 -->
    <rect width="64" height="48" rx="10" fill="#fff" stroke="#c9e7ee"/>
    <text x="32" y="31" text-anchor="middle" font-size="18" fill="#0b9aa8" font-family="ui-monospace,monospace">&lt;/&gt;</text>
  </g>
  <g transform="translate(470 72)">
    <!-- 对勾徽章：一个圆环 + 一条勾（用 stroke 描边而不是 fill 填充） -->
    <rect width="56" height="44" rx="10" fill="#e6fbf7" stroke="#b7efe4"/>
    <circle cx="28" cy="22" r="8" fill="none" stroke="#12a87a" stroke-width="3"/>
  </g>

  <!-- 两盆绿植（用矩形当花盆和叶子，极简几何风） -->
  <rect x="546" y="210" width="18" height="70" rx="6" fill="#86efac"/>
  <rect x="552" y="190" width="6" height="22" rx="3" fill="#16a34a"/>
  <rect x="96" y="230" width="16" height="52" rx="6" fill="#5eead4"/>
  <rect x="101" y="214" width="6" height="18" rx="3" fill="#0f766e"/>
</svg>
